name: Submit a talk
description: Propose a short talk for the event.
title: "Talk: <your name>"
labels: ["talk-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a talk! A few things to know:

        - This issue and the resulting PR are **publicly visible**.
        - We'll contact you through this issue or your GitHub profile — no email field needed.
        - When an organizer merges the PR, your talk appears on the event page.
        - The bot accepts your submission as-is. If anything's off (e.g. a too-long summary), it'll auto-trim with a link back here for the full text and tell you what it did. The organizer can edit on the PR branch before merging.

  - type: input
    id: first
    attributes:
      label: First name
      placeholder: Jane
    validations:
      required: true

  - type: input
    id: last
    attributes:
      label: Last name
      placeholder: Doe
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Startup domain
      description: Just the domain — no `https://`, no trailing slash.
      placeholder: example.com
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: GitHub repo or gist to share (optional)
      description: A repo or gist URL related to your talk. Leave blank if you don't have one to share. Accepts `https://github.com/<user>/<repo>` or `https://gist.github.com/<user>/<id>`.
      placeholder: https://github.com/your-handle/your-repo
    validations:
      required: false

  - type: input
    id: twitter
    attributes:
      label: Twitter / X handle (optional)
      description: Your handle on X/Twitter, if you'd like it linked from your row. Just the handle (with or without `@`); also accepts a full `x.com/...` or `twitter.com/...` URL.
      placeholder: yourhandle
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Talk summary
      description: A short paragraph on what you're building and what you've learned. Keep it tight — ~50-100 words (max ~600 characters); the table on the homepage shows the first sentence with a "more" link to this issue, so put the most interesting thread first.
      placeholder: |
        We're building X because Y. The hardest thing so far has been Z, and what we learned is...
    validations:
      required: true

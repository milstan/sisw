name: Post-merge RSVP comment

# When an organizer merges a "talk-submission" PR, post a confirmation
# comment on the originating issue with the Luma event RSVP link (read
# from repo variable `SISW_EVENT_URL`). If the variable isn't set yet,
# the workflow still posts an "approved" comment but without an RSVP
# link.
#
# How email gets captured: speakers RSVP-ing on the Luma event share
# their email with the organizer (standard Luma attendee-list
# behavior). No form, no server, no separate tooling.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  rsvp-comment:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'talk-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on originating issue with RSVP link
        uses: actions/github-script@v7
        env:
          # Override via repo variable SISW_EVENT_URL when the public
          # event URL changes (or to fix the manage-vs-public URL).
          EVENT_URL: ${{ vars.SISW_EVENT_URL || 'https://luma.com/60a42tti' }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Recover the originating issue # and submitter handle from
            // the PR body, which the submission workflow wrote with the
            // shape "Submitted via #<N> by @<login>.".
            const issueMatch  = body.match(/#(\d+)/);
            const authorMatch = body.match(/by @([A-Za-z0-9-]+)/);
            if (!issueMatch) {
              core.warning('No "#<N>" issue reference found in PR body — skipping RSVP comment.');
              return;
            }
            const issue_number = parseInt(issueMatch[1], 10);
            const author = authorMatch ? authorMatch[1] : 'there';

            const eventUrl = (process.env.EVENT_URL || '').trim();
            const lines = [`@${author} 🎉 Your talk is approved and live on the homepage!`];
            if (eventUrl) {
              lines.push('');
              lines.push(
                `**Please RSVP to lock in your spot:** ${eventUrl}`
              );
              lines.push('');
              lines.push(
                "RSVP-ing on Luma shares your email with the organizer " +
                "(that's how we'll send you logistics — slot, venue, " +
                "speaker chat, etc.). No email collected anywhere else."
              );
            } else {
              lines.push('');
              lines.push(
                "_(RSVP link not configured yet. The organizer " +
                "will follow up via your GitHub profile.)_"
              );
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body: lines.join('\n'),
            });

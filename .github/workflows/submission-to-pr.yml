name: Talk submission → PR

# Triggered ONLY on issue creation (not edits, label changes, or comments)
# AND only when the issue carries the `talk-submission` label. The form
# applies that label automatically; manually-filed issues without the
# label cause the workflow to start but the job to skip — no PR, no
# comment, no label change.
#
# Fail-safe philosophy: validation NEVER blocks PR creation. If a field
# is malformed (over-length summary, broken repo URL, weird Twitter
# handle, blank required field), the workflow auto-corrects and
# continues. The PR body lists what got auto-corrected and the bot
# comments on the issue so the submitter knows; organizer can edit on
# the `talk/<issue#>` branch before merging if they care. The only
# thing that still blocks PR creation is dedup (one submission per
# speaker) — that's a content rule, not a hygiene problem.
#
# Idempotency: branch name `talk/<issue#>` is deterministic, so re-runs
# update the existing branch rather than create a duplicate. The dedup
# step is read-only against the GitHub API + _data/talks.yml; safe to
# retry. Append-entry is single-writer per branch.

on:
  issues:
    # `opened` fires when a submitter creates the issue (the normal path).
    # `reopened` is the organizer's manual re-trigger: close + reopen any
    # talk-submission issue to re-run validation/dedup/PR-creation against
    # the current workflow code (e.g. after a workflow improvement, or
    # after a stuck submission needs another pass).
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'talk-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/talk-submission.yml

      - name: Install Python deps
        run: pip install --quiet pyyaml

      - name: Validate + auto-correct fields
        id: validate
        env:
          PAYLOAD: ${{ steps.parse.outputs.jsonString }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        # Auto-correct rather than reject. Each problematic input gets a
        # sensible fallback + a human-readable note explaining what
        # changed. Notes accumulate into `notes_md` (markdown bullet
        # list); the PR body and a friendly issue comment surface them
        # to organizer + submitter. This is the single source of
        # canonical-field truth — downstream steps read from this
        # step's outputs, not from the raw PAYLOAD.
        run: |
          python3 <<'PY'
          import json, os, re, secrets
          p = json.loads(os.environ['PAYLOAD'])
          author = os.environ.get('AUTHOR', 'there')
          issue_num = os.environ.get('ISSUE', '')
          notes = []  # human-readable list of auto-corrections; empty = nothing changed

          # --- first / last ---
          # Issue Form enforces required:true on these, so empty values
          # are nearly impossible in practice — but defend anyway. Fall
          # back to GH handle so the speaker row has *something* the
          # organizer can correct on the branch.
          first = (p.get('first') or '').strip()
          last  = (p.get('last') or '').strip()
          if not first and not last:
              first = author
              notes.append(
                  f"Speaker name was blank — fell back to your GitHub handle "
                  f"(`{author}`). Edit the PR if you'd like a real name shown."
              )

          # --- domain ---
          # Strip protocol + trailing slash. Empty domain just means the
          # row won't render the domain link — no fix needed.
          domain = (p.get('domain') or '').strip()
          for prefix in ('https://', 'http://'):
              if domain.startswith(prefix):
                  domain = domain[len(prefix):]
          domain = domain.rstrip('/')

          # --- repo (optional, tolerant URL parsing, drop on any failure) ---
          repo_raw = (p.get('repo') or '').strip()
          repo_canonical = ''
          if repo_raw:
              # Strip URL fragment + .git suffix before pattern checks.
              repo = repo_raw.split('#', 1)[0]
              if repo.endswith('.git'):
                  repo = repo[:-4]
              gh_re   = re.compile(r'^https?://github\.com/([^/\s]+)/([^/\s]+)(/[^\s]*)?/?$')
              gist_re = re.compile(r'^https?://gist\.github\.com/([^/\s]+)/([A-Za-z0-9]+)(/[A-Za-z0-9]+)?/?$')
              gh_match   = gh_re.match(repo)
              gist_match = gist_re.match(repo)
              if gh_match:
                  user = gh_match.group(1)
                  name = gh_match.group(2).rstrip('/')
                  repo_canonical = f"https://github.com/{user}/{name}"
              elif gist_match:
                  user = gist_match.group(1)
                  gid  = gist_match.group(2)
                  repo_canonical = f"https://gist.github.com/{user}/{gid}"
              else:
                  notes.append(
                      f"Repo URL `{repo_raw}` didn't match `github.com/<user>/<repo>` "
                      "or `gist.github.com/<user>/<id>` — left blank. Edit the PR "
                      "to add a working URL."
                  )

          # --- twitter (optional) ---
          twitter_raw = (p.get('twitter') or '').strip()
          twitter_canonical = ''
          if twitter_raw:
              t = twitter_raw
              for prefix in ('https://', 'http://'):
                  if t.startswith(prefix):
                      t = t[len(prefix):]
              if t.startswith('www.'):
                  t = t[4:]
              for prefix in ('twitter.com/', 'x.com/'):
                  if t.startswith(prefix):
                      t = t[len(prefix):]
              t = t.lstrip('@').rstrip('/').split('/', 1)[0].split('?', 1)[0]
              if re.match(r'^[A-Za-z0-9_]{1,15}$', t):
                  twitter_canonical = t
              else:
                  notes.append(
                      f"Twitter/X handle `{twitter_raw}` doesn't look right "
                      "(must be 1-15 alphanumeric or underscore) — left blank."
                  )

          # --- summary ---
          # Cap at SUMMARY_MAX (600) for the YAML data contract. The
          # README's truncate_summary further trims to ~500 chars at
          # display time and adds a [...] link back to the issue, so
          # the full original is always one click away from the
          # homepage.
          SUMMARY_MAX = 600
          summary = (p.get('summary') or '').strip()
          if not summary:
              summary = f"_(see issue #{issue_num} for talk description)_"
              notes.append(
                  "Summary was blank — left a placeholder. Edit the PR to "
                  "add real content before merging."
              )
          elif len(summary) > SUMMARY_MAX:
              orig_len = len(summary)
              # Walk forward to the last sentence boundary that fits in
              # SUMMARY_MAX. Word-boundary fallback if no sentence end
              # is reasonably placed (i.e. the first sentence itself is
              # already huge).
              cut = -1
              for i, ch in enumerate(summary[:SUMMARY_MAX]):
                  if ch in '.!?' and (i + 1 == len(summary) or summary[i + 1].isspace()):
                      cut = i + 1
              if cut < SUMMARY_MAX * 0.4:
                  word_cut = summary.rfind(' ', 0, SUMMARY_MAX)
                  cut = word_cut if word_cut > 0 else SUMMARY_MAX
              summary = summary[:cut].rstrip()
              notes.append(
                  f"Summary trimmed from {orig_len} → {len(summary)} chars at "
                  f"sentence boundary. Full text stays on #{issue_num} — the "
                  "homepage links back via `[…]`."
              )

          # --- emit canonical outputs + notes ---
          notes_md = "\n".join(f"- {n}" for n in notes)
          delim = "EOF_" + secrets.token_hex(8)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"first_canonical={first}\n")
              f.write(f"last_canonical={last}\n")
              f.write(f"domain_canonical={domain}\n")
              f.write(f"repo_canonical={repo_canonical}\n")
              f.write(f"twitter_canonical={twitter_canonical}\n")
              f.write(f"summary_canonical<<{delim}\n{summary}\n{delim}\n")
              f.write(f"has_notes={'true' if notes else 'false'}\n")
              f.write(f"notes_md<<{delim}\n{notes_md}\n{delim}\n")
          PY

      - name: Check duplicate submission
        id: dup
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One submission per GitHub user. Three checks, in order. Each
        # produces a one-line URL to the existing submission and exits
        # early. Order matters: an approved talk wins over an open
        # issue, which wins over an open PR — that's also the order of
        # "most permanent / most decided" so the rejection comment
        # names the most authoritative existing submission. Builds the
        # rendered comment body here so the comment step doesn't have
        # to template strings into JS.
        run: |
          python3 <<'PY'
          # Dedup is three short-circuit checks, in priority order:
          #   (a) approved talk     — `submitter_github` already in _data/talks.yml
          #   (b) open issue        — another talk-submission issue by same author
          #   (c) open PR           — another talk-submission PR claiming same author
          # First hit wins; we name the kind so the rejection comment can be
          # tailored ("approved talk" / "open submission" / "pending review").
          import json, os, pathlib, re, secrets, subprocess, sys, yaml
          author = os.environ['AUTHOR']
          issue = int(os.environ['ISSUE'])
          repo_full = os.environ.get('GITHUB_REPOSITORY', '')
          existing_url = ''
          existing_kind = ''

          # (a) approved talk in _data/talks.yml
          path = pathlib.Path('_data/talks.yml')
          if path.exists():
              loaded = yaml.safe_load(path.read_text())
              if isinstance(loaded, list):
                  for t in loaded:
                      if isinstance(t, dict) and t.get('submitter_github') == author:
                          if t.get('issue'):
                              existing_url = f"https://github.com/{repo_full}/issues/{t['issue']}"
                          else:
                              existing_url = f"https://github.com/{repo_full}/blob/main/_data/talks.yml"
                          existing_kind = 'approved'
                          break

          def gh_json(args):
              try:
                  r = subprocess.run(
                      args, capture_output=True, text=True, check=True, timeout=30
                  )
                  return json.loads(r.stdout) if r.stdout.strip() else []
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired, json.JSONDecodeError) as e:
                  print(f"::warning::gh call failed: {e}", file=sys.stderr)
                  return []

          # (b) other open issue with talk-submission label by same user
          if not existing_url:
              issues = gh_json([
                  'gh', 'issue', 'list',
                  '--state', 'open',
                  '--label', 'talk-submission',
                  '--author', author,
                  '--json', 'number,url',
                  '--limit', '50',
              ])
              for i in issues:
                  if int(i.get('number', 0)) != issue:
                      existing_url = i.get('url', '')
                      existing_kind = 'open-issue'
                      break

          # (c) open PR with talk-submission label whose body claims the same author
          if not existing_url:
              prs = gh_json([
                  'gh', 'pr', 'list',
                  '--state', 'open',
                  '--label', 'talk-submission',
                  '--json', 'number,url,body',
                  '--limit', '50',
              ])
              author_re = re.compile(rf'by @{re.escape(author)}\b')
              for pr in prs:
                  if author_re.search(pr.get('body') or ''):
                      existing_url = pr.get('url', '')
                      existing_kind = 'open-pr'
                      break

          friendly = {
              'approved':   'an approved talk',
              'open-issue': 'an open submission',
              'open-pr':    'a pending review (PR)',
          }.get(existing_kind, 'a previous submission')

          if existing_url:
              body_lines = [
                  f"Thanks for submitting, @{author}! It looks like you already have {friendly} on this event:",
                  "",
                  existing_url,
                  "",
                  "We accept **one talk per speaker**. If you'd like to revise your submission:",
                  "- For an open submission/PR: close it and open a fresh issue with the corrected fields.",
                  "- For an already-approved talk: ask an organizer to update it directly on `_data/talks.yml` via PR.",
                  "",
                  "Closing this issue without a new submission is fine if you posted by mistake.",
              ]
              body = "\n".join(body_lines)
          else:
              body = ""

          delim = "EOF_" + secrets.token_hex(8)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"existing_url={existing_url}\n")
              f.write(f"existing_kind={existing_kind}\n")
              f.write(f"is_duplicate={'true' if existing_url else 'false'}\n")
              f.write(f"body<<{delim}\n{body}\n{delim}\n")
          PY

      - name: Comment on duplicate submission
        if: steps.dup.outputs.is_duplicate == 'true'
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.dup.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: process.env.BODY,
            });
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ['duplicate-submission'],
            });

      - name: Append entry to _data/talks.yml + regenerate README block
        if: steps.dup.outputs.is_duplicate == 'false'
        env:
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          FIRST: ${{ steps.validate.outputs.first_canonical }}
          LAST: ${{ steps.validate.outputs.last_canonical }}
          DOMAIN: ${{ steps.validate.outputs.domain_canonical }}
          REPO_CANONICAL: ${{ steps.validate.outputs.repo_canonical }}
          TWITTER_CANONICAL: ${{ steps.validate.outputs.twitter_canonical }}
          SUMMARY: ${{ steps.validate.outputs.summary_canonical }}
        run: |
          python3 <<'PY'
          import os, datetime, pathlib, re, yaml

          # 1. Append the new entry to _data/talks.yml. All fields are
          #    canonical — the validate step already trimmed/normalized,
          #    so this step is a pure write.
          path = pathlib.Path('_data/talks.yml')
          existing = []
          if path.exists():
              loaded = yaml.safe_load(path.read_text())
              if isinstance(loaded, list):
                  existing = loaded
          entry = {
              'first':            os.environ['FIRST'],
              'last':             os.environ['LAST'],
              'domain':           os.environ['DOMAIN'],
              'repo':             os.environ.get('REPO_CANONICAL', ''),
              'twitter':          os.environ.get('TWITTER_CANONICAL', ''),
              'summary':          os.environ['SUMMARY'],
              'submitter_github': os.environ['AUTHOR'],
              'submitted_at':     datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'issue':            int(os.environ['ISSUE']),
          }
          existing.append(entry)
          path.parent.mkdir(parents=True, exist_ok=True)
          header = (
              "# Approved talk submissions. Append-only — added via PRs from the\n"
              "# .github/workflows/submission-to-pr.yml workflow when an organizer merges.\n"
              "# Don't edit by hand unless you're correcting a typo.\n"
          )
          dumped = yaml.safe_dump(existing, sort_keys=False, allow_unicode=True, default_flow_style=False)
          path.write_text(header + dumped)

          # 2. Regenerate the README "Who's coming" table between the
          #    <!-- TALKS:START --> and <!-- TALKS:END --> markers. The
          #    homepage IS the README, rendered by github.com — no Jekyll
          #    pipeline involved.
          repo_full = os.environ.get('GITHUB_REPOSITORY', 'milstan/sisw')

          def md_escape(text):
              # Pipe and backslash are the only chars that break a markdown
              # table cell. Newlines collapse to spaces inside a cell.
              return text.replace('\\', '\\\\').replace('|', '\\|').replace('\n', ' ')

          def truncate_summary(text, issue_num, max_chars=500):
              # Keep the table compact. Take the first sentence (up to the
              # first ./?/! followed by space) if it fits in max_chars,
              # otherwise hard-cut at the nearest word boundary. Append a
              # clickable "…" linking to the originating issue where the
              # full submission lives.
              text = text.strip()
              if len(text) <= max_chars:
                  return md_escape(text)
              first_sentence_end = -1
              for i, ch in enumerate(text):
                  if ch in '.!?' and i + 1 < len(text) and text[i + 1].isspace():
                      first_sentence_end = i
                      break
              if 40 < first_sentence_end <= max_chars:
                  truncated = text[:first_sentence_end + 1]
              else:
                  cut = text.rfind(' ', 0, max_chars)
                  if cut < max_chars * 0.5:
                      cut = max_chars
                  truncated = text[:cut].rstrip().rstrip('.,;:!?')
              return f"{md_escape(truncated)} […](https://github.com/{repo_full}/issues/{issue_num})"

          # Two-column layout: speaker bio (name + domain + 𝕏 + project
          # icon, stacked) on the left, talk summary on the right. Gives
          # the summary roughly 70% of the table width which reads naturally
          # on github.com without forcing horizontal scroll. The bold name
          # is itself the link to the GitHub profile, so we don't repeat
          # the @handle alongside.
          rows = ["| Speaker | Talk |",
                  "|---|---|"]
          for t in existing:
              if not isinstance(t, dict):
                  continue
              first = (t.get('first') or '').strip()
              last  = (t.get('last') or '').strip()
              gh    = (t.get('submitter_github') or '').strip()
              dom   = (t.get('domain') or '').strip()
              repo  = (t.get('repo') or '').strip()
              tw    = (t.get('twitter') or '').strip()
              summ  = (t.get('summary') or '').strip()
              issue = t.get('issue')

              # Line 1: bold name. Linked to the GitHub profile if known —
              # the link IS the @handle reference, no need to repeat it.
              full_name = f"{md_escape(first)} {md_escape(last)}".strip()
              line1 = f"[**{full_name}**](https://github.com/{gh})" if gh else f"**{full_name}**"
              # Line 2: domain · 𝕏 · 🔗 — each segment present only when the
              # corresponding field is set. Skip the line entirely if all
              # three are absent.
              parts = []
              if dom:
                  parts.append(f"[{md_escape(dom)}](https://{dom})")
              if tw:
                  parts.append(f"[𝕏](https://x.com/{tw})")
              if repo:
                  parts.append(f"[🔗]({repo})")
              line2 = " · ".join(parts)

              speaker_cell = f"{line1}<br>{line2}" if line2 else line1
              summary_cell = truncate_summary(summ, issue) if issue else md_escape(summ)
              rows.append(f"| {speaker_cell} | {summary_cell} |")

          new_block = "<!-- TALKS:START -->\n" + "\n".join(rows) + "\n<!-- TALKS:END -->"
          readme = pathlib.Path('README.md')
          src = readme.read_text()
          updated = re.sub(
              r"<!-- TALKS:START -->.*?<!-- TALKS:END -->",
              lambda _m: new_block,
              src,
              count=1,
              flags=re.DOTALL,
          )
          if updated != src:
              readme.write_text(updated)
          else:
              # Markers missing — log a warning but don't fail the workflow.
              # The talks.yml update has already landed; an organizer can
              # restore the markers by hand.
              print("::warning::TALKS:START/END markers not found in README.md — table not regenerated.")
          PY

      - name: Build PR body
        if: steps.dup.outputs.is_duplicate == 'false'
        id: pr_body
        env:
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          FIRST: ${{ steps.validate.outputs.first_canonical }}
          LAST: ${{ steps.validate.outputs.last_canonical }}
          DOMAIN: ${{ steps.validate.outputs.domain_canonical }}
          REPO_CANONICAL: ${{ steps.validate.outputs.repo_canonical }}
          SUMMARY: ${{ steps.validate.outputs.summary_canonical }}
          HAS_NOTES: ${{ steps.validate.outputs.has_notes }}
          NOTES_MD: ${{ steps.validate.outputs.notes_md }}
        # Build the PR body in Python so multi-line summaries and the
        # optional auto-corrections section don't have to be templated
        # via brittle GitHub Actions expression conditionals. We use a
        # <blockquote> HTML tag for the summary so multi-line text
        # renders inside the blockquote without per-line `> ` prefix
        # gymnastics.
        run: |
          python3 <<'PY'
          import os, secrets
          first = os.environ['FIRST']
          last  = os.environ['LAST']
          domain = os.environ['DOMAIN']
          repo = os.environ.get('REPO_CANONICAL', '')
          summary = os.environ['SUMMARY']
          has_notes = os.environ.get('HAS_NOTES', 'false') == 'true'
          notes_md = os.environ.get('NOTES_MD', '')
          issue = os.environ['ISSUE']
          author = os.environ['AUTHOR']

          speaker = f"{first} {last}".strip() or '_(blank)_'
          domain_cell = f"<https://{domain}>" if domain else '_(none)_'
          repo_cell = repo if repo else '_(none)_'

          parts = [
              f"Submitted via #{issue} by @{author}.",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| **Speaker** | {speaker} |",
              f"| **Startup** | {domain_cell} |",
              f"| **Repo** | {repo_cell} |",
              "",
              "<blockquote>",
              "",
              summary,
              "",
              "</blockquote>",
          ]
          if has_notes:
              parts.extend([
                  "",
                  "---",
                  "",
                  "🛠️ **Auto-corrections applied** (organizer can edit on this branch before merging):",
                  "",
                  notes_md,
              ])
          parts.extend([
              "",
              "---",
              "",
              f"**Approve = merge this PR** (closes #{issue} and rebuilds the homepage). "
              f"**Reject = close this PR** with a brief comment. **Edit before approving:** "
              f"push commits to `talk/{issue}` (e.g. fix a typo in the summary), then merge.",
              "",
              f"Closes #{issue}",
          ])
          body = "\n".join(parts)

          delim = "EOF_" + secrets.token_hex(8)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"body<<{delim}\n{body}\n{delim}\n")
          PY

      - name: Detect existing PR branch
        # Purely informational. peter-evans/create-pull-request@v6 already
        # handles re-runs idempotently (updates the branch in place, doesn't
        # create a duplicate). Logging the detected state makes the rerun
        # behavior visible in the action log so a future maintainer doesn't
        # have to reverse-engineer it. continue-on-error so a 404 (fresh
        # branch) doesn't fail the job.
        if: steps.dup.outputs.is_duplicate == 'false'
        continue-on-error: true
        env:
          BRANCH: talk/${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "::notice::Branch ${BRANCH} already exists; create-pull-request will update it in place."
          else
            echo "::notice::Branch ${BRANCH} is fresh; create-pull-request will create it."
          fi

      - name: Open PR
        if: steps.dup.outputs.is_duplicate == 'false'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: talk/${{ github.event.issue.number }}
          commit-message: "Add talk: ${{ steps.validate.outputs.first_canonical }} ${{ steps.validate.outputs.last_canonical }}"
          title: "Talk submission: ${{ steps.validate.outputs.first_canonical }} ${{ steps.validate.outputs.last_canonical }}"
          labels: talk-submission
          body: ${{ steps.pr_body.outputs.body }}

      - name: Comment on auto-corrections
        # Friendly heads-up to the submitter when we auto-corrected
        # anything. Only fires after a successful PR creation so we can
        # reference the PR number, and only when notes are present.
        # No label added — auto-correction isn't a "needs work" state
        # the organizer needs to triage.
        if: steps.dup.outputs.is_duplicate == 'false' && steps.validate.outputs.has_notes == 'true' && steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v7
        env:
          NOTES_MD: ${{ steps.validate.outputs.notes_md }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        with:
          script: |
            const author = process.env.AUTHOR;
            const prNum = process.env.PR_NUMBER;
            const notes = process.env.NOTES_MD;
            const body = [
              `Thanks @${author}! Your submission is in PR #${prNum} — an organizer will review.`,
              '',
              '🛠️ A couple of small adjustments along the way:',
              '',
              notes,
              '',
              "If anything looks off, comment on the PR or here and the organizer will fix it before merging.",
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

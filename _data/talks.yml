  summary: 'Treat prompt authoring as a learning problem: feed in examples of desired
    output, and the LLM both analyses dimensions of quality and iteratively refines
    a candidate prompt against them, keeping the best-of-N. The key insight is that
    the model discovers what to optimise for — dimensions you wouldn''t think to specify
    — and grounds evaluation in your examples instead of self-assessment. We''ve used
    this in production at Leadbay for writing-style learning and cold-start ICP descriptions;
    it replaces hand-written prompts with learned ones, no fine-tuning, no GPU. I''ll
    walk through the protocol (analyse → generate → score → refine), share what surprised
    us (the anti-pattern list ended up being as load-bearing as the prompt itself),
    and compare it to few-shot, fine-tuning, and DSPy/OPRO.'

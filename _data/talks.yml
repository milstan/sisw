- first: pranav
  last: bedi
  domain: moda.dev
  repo: ''
  twitter: pranavbedi
  summary: 'Agents today learn like 2010-era SaaS: a human watches a dashboard, files
    a ticket, opens a PR. The user is upstream of the fix by days. That''s backwards,
    the user interaction IS the training signal. Every frustration, abandonment, and
    silent failure is a labeled example of what the agent shouldn''t have done. The
    job is to extract those labels automatically and pipe them into the next self-edit
    cycle.


    Example: one user typed "i received nothing, how come" at 2am.'
  submitter_github: pranavbedi
  submitted_at: '2026-05-17T00:36:36Z'
  issue: 20
- first: Tiger
  last: Wang
  domain: nessielabs.com
  repo: https://github.com/nessielabs/boring-orchestrator
  twitter: tigerjwang
  summary: The path to self-improving software is easier (and more agentic) than you
    might think. Our internal agent platform runs on ~500 lines of Express + SQLite
    + cron calling `claude -p` — no agent framework, no multi-agent protocol, no message
    bus. It's been running PR reviews and user-facing email campaign agents across
    Nessie in production. I'll share why we haven't needed anything fancier, where
    the simple loop actually breaks, and the case for under-engineering your orchestrator
    in 2026.
  submitter_github: thenewpotato

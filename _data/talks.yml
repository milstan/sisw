  summary: For self-improving agents, the most useful unit of change isn’t the model
    - it’s skills you already use everyday in your agents. Nessie keeps a team’s skills
    synchronized across Codex and Claude Code, observes how each is used, evaluates
    invocations for immediate failures, and captures explicit feedback when skills
    break. Those traces surface repeated workflows as new skills and propose concrete
    edits to existing ones. We’ll demo the full loop for managing, auditing, and self-improving
    skills in Nessie.

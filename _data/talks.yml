  summary: '> As implementation effort falls, specification and verification absorb
    more of the engineering effort.


    This talk compares the software development process when software is primarily
    built by human developers versus when software can increasingly observe, modify,
    test, and improve itself.


    The goal is not to argue that engineering effort disappears. The goal is to show
    how that effort shifts.'
